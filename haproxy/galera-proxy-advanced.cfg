global
    log stdout format raw local0
    insecure-fork-wanted
    external-check preserve-env
    user haproxy
    group haproxy

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout check 4s

frontend galera_frontend
    bind *:3306
    default_backend galera_nodes

backend galera_nodes
    balance leastconn
    option external-check
    external-check path /usr/local/bin:/usr/bin:/bin
    external-check command /usr/local/bin/check-galera.sh
    server galera1 galera1:3306 check inter 3s fall 2 rise 2
    server galera2 galera2:3306 check inter 3s fall 2 rise 2
    server galera3 galera3:3306 check inter 3s fall 2 rise 2
