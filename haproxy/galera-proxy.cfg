global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s

frontend galera_frontend
    bind *:3306
    default_backend galera_nodes

backend galera_nodes
    balance leastconn
    option mysql-check
    server galera1 galera1:3306 check inter 3s fall 2 rise 2
    server galera2 galera2:3306 check inter 3s fall 2 rise 2
    server galera3 galera3:3306 check inter 3s fall 2 rise 2
