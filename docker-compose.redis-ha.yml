x-redis-ha-hosts: &redis-ha-hosts
  - "redis=172.29.95.10"
  - "redis-replica=172.29.95.11"
  - "redis-sentinel-1=172.29.95.21"
  - "redis-sentinel-2=172.29.95.22"
  - "redis-sentinel-3=172.29.95.23"

services:
  redis:
    depends_on:
      redis-sentinel-1:
        condition: service_started
      redis-sentinel-2:
        condition: service_started
      redis-sentinel-3:
        condition: service_started
    extra_hosts: *redis-ha-hosts
    networks:
      redis-ha:
        ipv4_address: 172.29.95.10

  redis-replica:
    depends_on:
      redis-sentinel-1:
        condition: service_started
      redis-sentinel-2:
        condition: service_started
      redis-sentinel-3:
        condition: service_started
    extra_hosts: *redis-ha-hosts
    networks:
      redis-ha:
        ipv4_address: 172.29.95.11

  redis-sentinel-1:
    extra_hosts: *redis-ha-hosts
    networks:
      redis-ha:
        ipv4_address: 172.29.95.21

  redis-sentinel-2:
    extra_hosts: *redis-ha-hosts
    networks:
      redis-ha:
        ipv4_address: 172.29.95.22

  redis-sentinel-3:
    extra_hosts: *redis-ha-hosts
    networks:
      redis-ha:
        ipv4_address: 172.29.95.23

networks:
  redis-ha:
    name: distributed-three-tier_redis-ha
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.95.0/24
