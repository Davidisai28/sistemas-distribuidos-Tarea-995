global_defs {
    router_id GALERA_MASTER
    enable_script_security
    script_user root
}

vrrp_script check_haproxy {
    script "/usr/local/bin/check-haproxy.sh 3306"
    interval 2
    fall 2
    rise 2
    weight -20
}

vrrp_instance VI_GALERA {
    state MASTER
    interface eth0
    virtual_router_id 53
    priority 110
    advert_int 1
    unicast_src_ip 172.31.0.21
    unicast_peer {
        172.31.0.22
    }
    authentication {
        auth_type PASS
        auth_pass DISTHA03
    }
    virtual_ipaddress {
        172.31.0.240/24 dev eth0
    }
    track_script {
        check_haproxy
    }
}
